<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JATA · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e2a3a;
    --navy-deep: #16202d;
    --accent: #c89968;
    --accent-soft: #d9b890;
    --card: #ffffff;
    --ink: #2b2f36;
    --ink-soft: #565b63;
    --muted: #9aa0a8;
    --line: #e2e5e9;
    --line-strong: #d2d6db;
    --field: #f7f8fa;
    --shadow: 0 1px 3px rgba(40, 45, 55, 0.06);
    --shadow-card: 0 18px 50px rgba(30, 42, 58, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: #eef2f7;
    background-image:
      radial-gradient(circle at 16% 20%, rgba(30, 42, 58, 0.07) 0%, transparent 46%),
      radial-gradient(circle at 84% 82%, rgba(200, 153, 104, 0.10) 0%, transparent 46%),
      linear-gradient(135deg, #eef2f7 0%, #e5ebf2 100%);
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-card);
    padding: 44px 40px 36px;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--accent) 100%);
  }

  /* Brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 34px;
  }
  .brand .logo {
    width: 44px; height: 44px;
    background: var(--navy);
    color: #fff;
    display: grid;
    place-items: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 1px;
    border-radius: 4px;
  }
  .brand-text { line-height: 1.15; }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: var(--ink);
  }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 3px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.2px;
    line-height: 1.1;
  }
  .title { margin-bottom: 30px; }

  /* Fields */
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 13px 15px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    transition: all 0.2s ease;
  }
  .field input::placeholder { color: var(--muted); }
  .field input:focus {
    outline: none;
    border-color: var(--navy);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(30, 42, 58, 0.10);
  }

  .btn {
    width: 100%;
    margin-top: 10px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn:hover { background: var(--navy-deep); }
  .btn:active { transform: translateY(1px); }

  .hint {
    font-size: 12px;
    color: var(--danger, #b04a4a);
    margin-top: 14px;
    min-height: 16px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .hint.show { opacity: 1; }
</style>
</head>
<body>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="brand">
      <div class="logo">J</div>
      <div class="brand-text">
        <div class="brand-name">JATA</div>
        <div class="brand-sub">Predicción de Cosecha</div>
      </div>
    </div>

    <h1 class="title">Iniciar sesión</h1>

    <div class="field">
      <label for="user-name">Nombre</label>
      <input type="text" id="user-name" name="user-name" placeholder="Tu nombre" autofocus autocomplete="name" />
    </div>

    <div class="field">
      <label for="username">Correo</label>
      <input type="text" id="username" name="username" placeholder="correo@empresa.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" />
    </div>

    <button type="submit" class="btn">Entrar</button>
    <div class="hint" id="hint">Ingresa usuario y contraseña.</div>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const form = document.getElementById('login-form');
  const hint = document.getElementById('hint');
  const btn  = form.querySelector('.btn');
  let sb;

  async function initSupabase() {
    const cfg = await fetch('/config').then(r => r.json());
    const { createClient } = supabase;
    sb = createClient(cfg.supabase_url, cfg.supabase_anon_key);
  }

  initSupabase().catch(() => {
    hint.textContent = 'Error de configuración. Contacta al administrador.';
    hint.classList.add('show');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('username').value.trim();
    const pass  = document.getElementById('password').value;

    if (!email || !pass) {
      hint.textContent = 'Ingresa tu correo y contraseña.';
      hint.classList.add('show');
      return;
    }
    hint.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando…';

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

    if (error) {
      hint.textContent = 'Credenciales inválidas.';
      hint.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    const token = data.session.access_token;
    localStorage.setItem('sb_token', token);

    // Resolve name: form input → DB fallback
    const formName = document.getElementById('user-name').value.trim();
    try {
      const me = await fetch('/me', { headers: { 'Authorization': `Bearer ${token}` } });
      const profile = await me.json();
      let finalName = formName || (profile.full_name && profile.full_name !== email ? profile.full_name : '');
      if (formName && formName !== profile.full_name) {
        await fetch('/me', {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name: formName }),
        });
      }
      if (finalName) localStorage.setItem('sb_user_name', finalName);
    } catch (_) {
      if (formName) localStorage.setItem('sb_user_name', formName);
    }
    window.location.href = '/app';
  });
</script>
</body>
</html>
